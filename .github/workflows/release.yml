name: Build & release

# Builds the Windows installer on GitHub's Windows machines.
# Publishes a release (tag v<VERSION.txt>) when VERSION.txt changes on main,
# when run manually from the Actions tab, or when a v* tag is pushed.
on:
  push:
    branches: [main]
    paths: ['VERSION.txt']
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    env:
      HAS_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r source/requirements.txt pyinstaller scipy scikit-image aggdraw

      - name: Updater tests
        run: python tests/test_updater.py

      - name: Layer toggle regression tests
        run: python tests/test_toggle_regressions.py

      - name: Letter spacing tests
        run: python tests/test_letter_spacing.py

      - name: Build app
        env:
          REPO: ${{ github.repository }}
        shell: pwsh
        run: |
          # Releases from this repository check it for updates; other builds don't.
          Set-Content -NoNewline -Path source/update_repo.txt -Value $env:REPO
          python -m PyInstaller --noconfirm --distpath dist --workpath work "build/Dirt Gear.spec"

      - name: Build payload
        run: python build/build_payload.py

      - name: Build installer
        shell: pwsh
        run: |
          $version = (Get-Content VERSION.txt).Trim()
          python -m PyInstaller --noconfirm --onefile --windowed --name "Dirt-Gear-Setup-$version" `
            --icon "$PWD\source\icon.ico" --add-data "$PWD\build\payload.zip;." --add-data "$PWD\VERSION.txt;." `
            --distpath release --workpath work\installer --specpath work\installer "$PWD\build\installer.py"
          "VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Make signed update manifest
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: python tools/make_update.py "release/Dirt-Gear-Setup-${{ env.VERSION }}.exe" "${{ env.VERSION }}" release

      - name: Test the installed app
        shell: pwsh
        run: |
          $t = "$env:RUNNER_TEMP\dg"
          New-Item -ItemType Directory -Force "$t\fixtures", "$t\lad\Moto Gear\Logos" | Out-Null
          # Clean install into a test folder
          Start-Process -Wait -FilePath "release\Dirt-Gear-Setup-$env:VERSION.exe" -ArgumentList '--quiet','--no-shortcuts','--target',"$t\app"
          if (-not (Test-Path "$t\app\Dirt Gear.exe")) { throw 'Installer did not produce Dirt Gear.exe' }
          # Launch the installed copy headless with an isolated LOCALAPPDATA
          $env:LOCALAPPDATA = "$t\lad"
          Start-Process -FilePath "$t\app\Dirt Gear.exe" -ArgumentList '--no-browser','--session-file',"$t\session.json"
          for ($i = 0; $i -lt 60 -and -not (Test-Path "$t\session.json"); $i++) { Start-Sleep 1 }
          if (-not (Test-Path "$t\session.json")) { throw 'Installed app did not start' }
          python tests/make_test_psd.py "$t\fixtures\test-gear.psd"
          python tests/test_backend.py "$t"
          # The installed app knows its version and the repository it updates from
          $s = Get-Content "$t\session.json" | ConvertFrom-Json
          $p = Invoke-RestMethod -Uri "http://127.0.0.1:$($s.port)/api/platform" -Headers @{ 'X-Dirt-Token' = $s.token }
          if ($p.version -ne $env:VERSION -or -not $p.updates) { throw "Installed app reports version $($p.version), updates=$($p.updates)" }
          Get-Process -Name 'Dirt Gear' -ErrorAction SilentlyContinue | Stop-Process -Force
          Start-Sleep 2
          # Silent update mode replaces the installed copy in place
          Start-Process -Wait -FilePath "release\Dirt-Gear-Setup-$env:VERSION.exe" -ArgumentList '--update','--no-launch','--target',"$t\app"
          if (-not (Test-Path "$t\app\Dirt Gear.exe")) { throw 'Update mode did not leave Dirt Gear.exe in place' }

      - name: End-to-end self-update test
        if: env.HAS_SIGNING_KEY == 'true'
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        shell: pwsh
        run: |
          # An installed copy finds a (fake, local) newer signed release, downloads it,
          # closes, the installer updates it in place and Dirt Gear reopens.
          $t = "$env:RUNNER_TEMP\e2e"; $fake = "$t\fake"
          New-Item -ItemType Directory -Force "$fake\repos\$env:GITHUB_REPOSITORY\releases", "$fake\dl", "$t\lad" | Out-Null
          Copy-Item "release\Dirt-Gear-Setup-$env:VERSION.exe" "$fake\dl\Dirt-Gear-Setup-99.0.0.exe"
          python tools/make_update.py "$fake\dl\Dirt-Gear-Setup-99.0.0.exe" 99.0.0 "$fake\dl"
          $base = 'http://127.0.0.1:8799'
          $release = @{ tag_name = 'v99.0.0'; html_url = 'https://github.com/x/y'; body = 'e2e'; assets = @(
            @{ name = 'Dirt-Gear-Setup-99.0.0.exe'; browser_download_url = "$base/dl/Dirt-Gear-Setup-99.0.0.exe" },
            @{ name = 'update.json'; browser_download_url = "$base/dl/update.json" },
            @{ name = 'update.json.sig'; browser_download_url = "$base/dl/update.json.sig" }) } | ConvertTo-Json -Depth 4
          Set-Content -Path "$fake\repos\$env:GITHUB_REPOSITORY\releases\latest" -Value $release -NoNewline
          Start-Process -FilePath python -ArgumentList '-m','http.server','8799','--bind','127.0.0.1' -WorkingDirectory $fake
          Start-Process -Wait -FilePath "release\Dirt-Gear-Setup-$env:VERSION.exe" -ArgumentList '--quiet','--no-shortcuts','--target',"$t\app"
          $env:LOCALAPPDATA = "$t\lad"; $env:DIRT_GEAR_UPDATE_API = $base
          $app = Start-Process -PassThru -FilePath "$t\app\Dirt Gear.exe" -ArgumentList '--no-browser','--session-file',"$t\session.json"
          for ($i = 0; $i -lt 60 -and -not (Test-Path "$t\session.json"); $i++) { Start-Sleep 1 }
          $s = Get-Content "$t\session.json" | ConvertFrom-Json
          $h = @{ 'X-Dirt-Token' = $s.token }; $api = "http://127.0.0.1:$($s.port)/api"
          $check = Invoke-RestMethod -Uri "$api/update/check?manual=1" -Headers $h
          if (-not ($check.available -and $check.signed -and $check.can_install)) { throw "Update not offered for install: $($check | ConvertTo-Json)" }
          $before = (Get-Item "$t\app\Dirt Gear.exe").LastWriteTimeUtc
          $marker = "$t\app\_internal\old-copy-marker.txt"; Set-Content $marker 'old'
          Invoke-RestMethod -Method Post -Uri "$api/update/install" -Headers $h -ContentType 'application/json' -Body '{}' | Out-Null
          if (-not $app.WaitForExit(30000)) { throw 'Dirt Gear did not close for the update' }
          for ($i = 0; $i -lt 90 -and (Test-Path $marker); $i++) { Start-Sleep 1 }
          if (Test-Path $marker) { throw 'The installer did not replace the installed copy' }
          $relaunched = $null
          for ($i = 0; $i -lt 60 -and -not $relaunched; $i++) { Start-Sleep 1; $relaunched = Get-Process -Name 'Dirt Gear' -ErrorAction SilentlyContinue }
          if ($relaunched) { Write-Host 'Self-update OK: app closed, files replaced, app reopened'; $relaunched | Stop-Process -Force }
          else { Write-Warning 'Files were updated, but the reopened window was not seen (CI machines may not show desktop windows).' }

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $tag = "v$env:VERSION"
          gh release view $tag 2>$null
          if ($LASTEXITCODE -eq 0) { Write-Host "Release $tag already exists - bump VERSION.txt for a new one."; exit 0 }
          $notes = (Get-Content CHANGELOG.md -Raw) -split '\r?\n---\r?\n' | Select-Object -First 1
          $notes | Out-File notes.md -Encoding utf8
          $files = @("release\Dirt-Gear-Setup-$env:VERSION.exe", 'release\update.json')
          if (Test-Path 'release\update.json.sig') { $files += 'release\update.json.sig' }
          gh release create $tag @files --target $env:GITHUB_SHA --title "Dirt Gear v$env:VERSION" --notes-file notes.md

      - name: Keep build as artifact
        uses: actions/upload-artifact@v4
        with:
          name: Dirt-Gear-Setup
          path: release/*.exe
